name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a deploy mid-way.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # next-env.d.ts is gitignored; without it image imports have no types and the type-aware lint fails.
      - run: npx next typegen
      - run: npm run check
      - run: npx next build

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Shows each deploy under the repo's Deployments, linked to the live site.
    environment:
      name: production
      url: https://kzn.sh
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ALCHEMY_PASSWORD: ${{ secrets.ALCHEMY_PASSWORD }}
      ALCHEMY_STATE_TOKEN: ${{ secrets.ALCHEMY_STATE_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
      LASTFM_TOKEN: ${{ secrets.LASTFM_TOKEN }}
      SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
      TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
      CAL_TOKEN: ${{ secrets.CAL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Cloudflare's asset upload sometimes answers 503; a second try usually goes through.
      - name: Deploy
        run: npm run deploy:ci || (sleep 20 && npm run deploy:ci)
